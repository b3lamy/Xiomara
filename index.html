<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Corazón de Partículas Azules</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    // Paleta de colores exacta mostrada en el video
    const BLUE_SHADES = [
      "#38b2f6", "#60a5fa", // blue-400
      "#93c5fd", "#2563eb", // blue-600
      "#bfdbfe", "#1d4ed8", // blue-700
      "#38bdf8", "#e0f2fe"  // brillos cian/blancos adicionales
    ];

    const floatParticles = [];
    const burstParticles = [];
    const heartParticles = [];
    const FLOAT_COUNT = 160;
    const HEART_COUNT = 3200;

    // Función matemática para generar coordenadas dentro de la silueta de un corazón
    function getHeartPoint(scale) {
      const t = Math.random() * Math.PI * 2;
      // Distribución concentrada hacia los bordes pero rellenando el interior
      const r = Math.pow(Math.random(), 0.42);
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(
        13 * Math.cos(t) -
        5 * Math.cos(2 * t) -
        2 * Math.cos(3 * t) -
        Math.cos(4 * t)
      );
      return {
        x: x * r * scale,
        y: y * r * scale
      };
    }

    class Particle {
      constructor(x, y, type) {
        this.type = type;
        this.color = BLUE_SHADES[Math.floor(Math.random() * BLUE_SHADES.length)];

        if (type === "float") {
          this.x = x;
          this.y = y;
          this.vx = (Math.random() - 0.5) * 0.4;
          this.vy = -Math.random() * 0.8 - 0.2;
          this.size = Math.random() * 1.8 + 0.5;
          this.maxLife = 120 + Math.random() * 120;
          this.life = Math.random() * this.maxLife;
        } else if (type === "burst") {
          this.x = x;
          this.y = y;
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 6 + 1.5;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed;
          this.size = Math.random() * 2.4 + 0.8;
          this.maxLife = 50 + Math.random() * 50;
          this.life = 0;
        } else if (type === "heart") {
          this.resetHeartTarget();
          this.x = this.tx + (Math.random() - 0.5) * 30;
          this.y = this.ty + (Math.random() - 0.5) * 30;
          this.vx = 0;
          this.vy = 0;
          this.size = Math.random() * 1.9 + 0.6;
          this.shimmerOffset = Math.random() * Math.PI * 2;
          this.vortexAngle = Math.random() * Math.PI * 2;
          this.vortexSpeed = (Math.random() - 0.5) * 0.08;
        }
      }

      resetHeartTarget() {
        const scale = Math.min(width, height) * 0.0135;
        const pt = getHeartPoint(scale);
        this.tx = width / 2 + pt.x;
        this.ty = height / 2 - Math.min(width, height) * 0.04 + pt.y;
      }

      update(phase, chargeLevel) {
        if (this.type === "float") {
          this.x += this.vx;
          this.y += this.vy;
          this.life++;
          if (this.life >= this.maxLife || this.y < 0) {
            this.x = width / 2 + (Math.random() - 0.5) * 260;
            this.y = height / 2 + Math.min(width, height) * 0.2 + (Math.random() - 0.5) * 40;
            this.life = 0;
          }
        } else if (this.type === "burst") {
          this.x += this.vx;
          this.y += this.vy;
          this.vx *= 0.95;
          this.vy *= 0.95;
          // Ligera turbulencia
          this.vx += (Math.random() - 0.5) * 0.3;
          this.vy += (Math.random() - 0.5) * 0.3;
          this.life++;
        } else if (this.type === "heart") {
          if (phase === "exploded") {
            // Movimiento de turbulencia/nebulosa durante la explosión
            this.vortexAngle += this.vortexSpeed;
            this.vx += Math.cos(this.vortexAngle) * 0.25;
            this.vy += Math.sin(this.vortexAngle) * 0.25;
            this.vx *= 0.94;
            this.vy *= 0.94;
            this.x += this.vx;
            this.y += this.vy;
          } else {
            // Atracción suave hacia la forma del corazón
            const dx = this.tx - this.x;
            const dy = this.ty - this.y;
            this.vx = this.vx * 0.85 + dx * 0.07;
            this.vy = this.vy * 0.85 + dy * 0.07;

            // Vibración de energía interna
            const jitter = 0.3 + chargeLevel * 0.9;
            this.x += this.vx + (Math.random() - 0.5) * jitter;
            this.y += this.vy + (Math.random() - 0.5) * jitter;
          }
        }
      }

      draw(ctx, time, chargeLevel, phase) {
        ctx.fillStyle = this.color;
        if (this.type === "float") {
          const alpha = Math.sin((this.life / this.maxLife) * Math.PI) * 0.65;
          ctx.globalAlpha = Math.max(0, alpha);
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        } else if (this.type === "burst") {
          const alpha = 1 - this.life / this.maxLife;
          ctx.globalAlpha = Math.max(0, alpha);
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        } else if (this.type === "heart") {
          const shimmer = 0.55 + 0.45 * Math.sin(time * 0.006 + this.shimmerOffset);
          const extraGlow = phase === "charging" ? chargeLevel * 0.4 : 0.2;
          ctx.globalAlpha = Math.min(1, shimmer + extraGlow);
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // Inicialización de partículas flotantes (igual que en el video)
    for (let i = 0; i < FLOAT_COUNT; i++) {
      const p = new Particle(
        Math.random() * width,
        Math.random() * height,
        "float"
      );
      p.life = Math.random() * p.maxLife; // stagger starting life
      floatParticles.push(p);
    }

    // Inicialización de las partículas del corazón
    for (let i = 0; i < HEART_COUNT; i++) {
      heartParticles.push(new Particle(width / 2, height / 2, "heart"));
    }

    // Función de explosión de partículas del video
    function spawnHeartBurst(x, y) {
      const count = 140;
      for (let i = 0; i < count; i++) {
        burstParticles.push(new Particle(x, y, "burst"));
      }
    }

    // Dibuja el portal/base brillante azul debajo del corazón
    function drawGlowingBase(time, chargeLevel) {
      const scale = Math.min(width, height) * 0.0135;
      const baseX = width / 2;
      const baseY = height / 2 - Math.min(width, height) * 0.04 + 17.5 * scale;
      const rx = scale * 9.5;
      const ry = scale * 2.2;

      ctx.save();
      ctx.globalCompositeOperation = "lighter";

      // Resplandor elíptico principal
      ctx.translate(baseX, baseY);
      ctx.scale(1, ry / rx);

      const pulse = 1 + Math.sin(time * 0.008) * 0.08 + chargeLevel * 0.15;
      const grad = ctx.createRadialGradient(0, 0, 2, 0, 0, rx * pulse);
      grad.addColorStop(0, "rgba(224, 242, 254, 0.95)");
      grad.addColorStop(0.3, "rgba(56, 189, 248, 0.75)");
      grad.addColorStop(0.65, "rgba(37, 99, 235, 0.35)");
      grad.addColorStop(1, "rgba(29, 78, 216, 0)");

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, rx * pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Haz de energía ascendente hacia la punta del corazón
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const beamGrad = ctx.createLinearGradient(baseX, baseY, baseX, baseY - scale * 10);
      beamGrad.addColorStop(0, "rgba(56, 189, 248, 0.45)");
      beamGrad.addColorStop(1, "rgba(56, 189, 248, 0)");
      ctx.fillStyle = beamGrad;
      ctx.beginPath();
      ctx.moveTo(baseX - rx * 0.6, baseY);
      ctx.lineTo(baseX + rx * 0.6, baseY);
      ctx.lineTo(baseX + rx * 0.2, baseY - scale * 9);
      ctx.lineTo(baseX - rx * 0.2, baseY - scale * 9);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // Dispara la dispersión/explosión del corazón en múltiples núcleos
    function triggerExplosion() {
      const scale = Math.min(width, height) * 0.0135;
      const cx = width / 2;
      const cy = height / 2 - Math.min(width, height) * 0.04;

      // Crear varios focos de explosión dentro del corazón
      const clusters = 8;
      const centers = [];
      for (let i = 0; i < clusters; i++) {
        const pt = getHeartPoint(scale * 0.8);
        const bx = cx + pt.x;
        const by = cy + pt.y;
        centers.push({ x: bx, y: by });
        spawnHeartBurst(bx, by);
      }

      // Impulsar las partículas del corazón en remolinos
      heartParticles.forEach((p) => {
        const c = centers[Math.floor(Math.random() * centers.length)];
        const angle = Math.atan2(p.y - c.y, p.x - c.x) + (Math.random() - 0.5) * 1.2;
        const force = Math.random() * 7 + 1.5;
        p.vx = Math.cos(angle) * force;
        p.vy = Math.sin(angle) * force;
      });
    }

    // Control del ciclo de animación (Carga -> Explosión -> Reconstrucción)
    let cycleStart = performance.now();
    let phase = "charging";
    let explodedTriggered = false;

    function animate(now) {
      requestAnimationFrame(animate);

      // Estela suave en fondo negro para dar efecto de brillo en movimiento
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 0.28;
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, width, height);

      const elapsed = (now - cycleStart) % 9000; // Ciclo de 9 segundos
      let chargeLevel = 0;

      if (elapsed < 4200) {
        phase = "charging";
        explodedTriggered = false;
        chargeLevel = elapsed / 4200;
      } else if (elapsed < 6800) {
        phase = "exploded";
        chargeLevel = 1;
        if (!explodedTriggered) {
          explodedTriggered = true;
          triggerExplosion();
        }
      } else {
        phase = "reforming";
        chargeLevel = 1 - (elapsed - 6800) / 2200;
      }

      // Dibujar base luminosa
      drawGlowingBase(now, chargeLevel);

      // Modo de fusión aditiva para que las partículas brillen al superponerse
      ctx.globalCompositeOperation = "lighter";

      // Actualizar y dibujar partículas flotantes de fondo
      for (let i = 0; i < floatParticles.length; i++) {
        floatParticles[i].update(phase, chargeLevel);
        floatParticles[i].draw(ctx, now, chargeLevel, phase);
      }

      // Actualizar y dibujar partículas del corazón
      for (let i = 0; i < heartParticles.length; i++) {
        heartParticles[i].update(phase, chargeLevel);
        heartParticles[i].draw(ctx, now, chargeLevel, phase);
      }

      // Actualizar y dibujar partículas de explosión (burstParticles)
      for (let i = burstParticles.length - 1; i >= 0; i--) {
        const bp = burstParticles[i];
        bp.update(phase, chargeLevel);
        bp.draw(ctx, now, chargeLevel, phase);
        if (bp.life >= bp.maxLife) {
          burstParticles.splice(i, 1);
        }
      }
    }

    // Interacción: al hacer clic o tocar la pantalla se genera una explosión
    window.addEventListener("pointerdown", (e) => {
      spawnHeartBurst(e.clientX, e.clientY);
      cycleStart = performance.now() - 4200;
      explodedTriggered = false;
    });

    // Ajuste automático si cambia el tamaño de la pantalla
    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      heartParticles.forEach((p) => p.resetHeartTarget());
    });

    requestAnimationFrame(animate);
  </script>
</body>
</html>
